<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>To-Do List Dafa</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <!-- FOTO DI ATAS BORDER -->
      <div class="poster-container">
        <img
          src="image\poster-fstvlst-paradoks-diametral.png"
          alt="Poster FSTVLST Paradoks Diametral"
          class="poster"
        />
      </div>

      <!-- ISI TO DO LIST -->
      <section class="todo-content">
        <header class="header">
          <h1>TO-DO LIST</h1>

          <p>Catat kegiatanmu agar lebih teratur</p>
        </header>

        <section class="todo-section">
          <h2>Daftar Kegiatan</h2>

          <div class="input-area">
            <input
              type="text"
              id="todoInput"
              placeholder="Masukkan kegiatan..."
            />

            <button id="addButton">Tambah</button>
          </div>

          <!-- Daftar kegiatan -->
          <ul id="todoList"></ul>

          <!-- Statistik -->
          <div class="stats">
            <p>
              Total:
              <span id="totalTask">0</span>
            </p>

            <p>
              Selesai:
              <span id="completedTask">0</span>
            </p>
          </div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
